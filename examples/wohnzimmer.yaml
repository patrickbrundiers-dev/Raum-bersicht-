# Beispiel: komplette Raumseite Wohnzimmer mit einer einzigen Karte
# Ersetzt die Abschnitte Klima, Lampen & Fenster und Multimedia.
type: sections
title: Wohnzimmer
path: wohnzimmer
icon: mdi:television
theme: Frosted Glass Lite
max_columns: 2
sections:
  - type: grid
    cards:
      - type: custom:raum-uebersicht-card
        room:
          area: wohnzimmer
          # Nur nötig, wenn die Fenstergruppe nicht dem Bereich zugeordnet ist.
          # Die Karte zeigt dann die einzelnen Fenster der Gruppe:
          window: binary_sensor.fenster_wohnzimmer
          # Optional, wird sonst automatisch gefunden:
          # climate: climate.wohnzimmer_bt
